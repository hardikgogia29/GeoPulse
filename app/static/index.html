<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B7A5A" />
<title>GeoPulse — NYC bike demand</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<link rel="stylesheet" href="/static/app.css" />
</head>
<body>

<div id="map"></div>
<div id="map-scrim" aria-hidden="true"></div>

<!-- ── floating search ─────────────────────────────────────────── -->
<header class="topbar">
  <div class="search-pill">
    <svg class="pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
    <input id="place-input" type="search" autocomplete="off" spellcheck="false"
           placeholder="Where are you in NYC?" aria-label="Search a place in NYC" />
    <button id="place-clear" class="icon-btn ghost" aria-label="Clear" hidden>
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="suggestions" class="suggestions" role="listbox" hidden></div>
</header>

<!-- ── basemap switcher ────────────────────────────────────────── -->
<div class="mapstyle" id="mapstyle">
  <button class="mapstyle-toggle" id="mapstyle-toggle" aria-label="Change map style"
          aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
  </button>
  <div class="mapstyle-list" id="mapstyle-list" hidden></div>
  <button class="mapstyle-toggle grid-toggle" id="grid-toggle"
          aria-label="Show demand heatmap" aria-pressed="false" title="Demand heatmap">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 4.6v9.2L12 22l-8-4.6V6.6L12 2z"/></svg>
  </button>
</div>

<!-- ── legend ──────────────────────────────────────────────────── -->
<div class="legend" id="legend">
  <span class="legend-title">Predicted pickups</span>
  <div class="legend-scale" aria-hidden="true"></div>
  <div class="legend-ends"><span>low</span><span id="legend-max">—</span></div>
</div>

<!-- ── bottom sheet ────────────────────────────────────────────── -->
<section class="sheet" id="sheet" aria-label="Forecast panel">
  <button class="grabber" id="grabber" aria-label="Expand or collapse panel"><span></span></button>

  <div class="sheet-head">
    <div class="sheet-title">
      <h1 id="sheet-place">NYC overview</h1>
      <p id="sheet-sub" class="muted">Pick a place or ask a question</p>
    </div>
    <div class="live-dot" id="mode-badge" title="Assistant mode">
      <span class="dot"></span><span id="mode-text">router</span>
    </div>
  </div>

  <!-- controls -->
  <div class="chips" id="chips">
    <div class="chip-group" role="group" aria-label="Model">
      <span class="chip-label">Model</span>
      <div class="chip-row" id="model-chips"></div>
    </div>
    <div class="chip-group" role="group" aria-label="Grid">
      <span class="chip-label">Grid</span>
      <div class="chip-row" id="grid-chips"></div>
    </div>
    <div class="chip-group" role="group" aria-label="Horizon">
      <span class="chip-label">Ahead</span>
      <div class="chip-row" id="horizon-chips"></div>
    </div>
    <div class="chip-group time-group" role="group" aria-label="Time">
      <span class="chip-label">When</span>
      <input type="datetime-local" id="when-input" step="900" />
    </div>
  </div>

  <div class="notice" id="notice"></div>

  <!-- results -->
  <div class="sheet-body" id="sheet-body">
    <div id="cards" class="cards"></div>
    <div id="chat" class="chat" aria-live="polite"></div>
  </div>

  <!-- composer -->
  <form class="composer" id="composer" autocomplete="off">
    <input id="chat-input" type="text" placeholder="Ask: will I find a bike here?" aria-label="Ask a question" />
    <button class="send" id="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <div class="quick" id="quick">
    <button data-q="Will I find a bike here?">Will I find a bike?</button>
    <button data-q="Take me to a bike">Take me there</button>
    <button data-q="Why is that the case?">Why?</button>
    <button data-q="Compare models here">Compare models</button>
    <button data-q="Where is busiest in the city?">Busiest areas</button>
  </div>
</section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
