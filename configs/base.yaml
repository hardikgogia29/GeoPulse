# GeoPulse - base configuration
# Every tunable value in the project lives in configs/. Nothing here is duplicated
# as a literal in src/ or scripts/.

project:
  name: geopulse
  random_seed: 42

paths:
  # Project-relative roots (resolved against the repo root by src.utils.config)
  data_root: data
  raw: data/raw
  interim: data/interim
  processed: data/processed
  spatial: data/spatial
  external: data/external
  dev_sample: data/dev_sample
  outputs: outputs
  models: outputs/models
  metrics: outputs/metrics
  figures: outputs/figures
  experiments: outputs/experiments
  reports: outputs/reports

sources:
  # PLACEHOLDER PATHS - point these at your own downloaded copies before running
  # 01_ingest.py / 05_station_registry.py / 04_prepare_events.py. Nothing under
  # data/ is committed to this repo (see .gitignore); download the public sources
  # yourself and drop them here, or edit these paths to wherever you keep them.
  #   - citibike_trip_dir: monthly trip-history CSVs/zips from the Citi Bike public
  #     S3 tripdata bucket, https://citibikenyc.com/system-data (~15 GB, 90 files
  #     for 2023-2024).
  #   - station_roster_csv: a Citi Bike station roster snapshot (cross-check only),
  #     from the same system-data page or the live GBFS station_information feed.
  #   - events_csv: "NYC Permitted Event Information - Historical" from NYC Open
  #     Data (Socrata), https://data.cityofnewyork.us.
  citibike_trip_dir: "data/raw/citibike"
  citibike_trip_glob: "*-citibike-tripdata*.csv"
  station_roster_csv: "data/external/citibike_stations_data.csv"
  events_csv: "data/external/NYC_Permitted_Event_Information_-_Historical.csv"
  # The manually downloaded DOT_traffic_speeds_after_2018-07-01_*.csv covered
  # 2018-07-26..30 only (row-capped Socrata UI export) and is NOT used. Traffic is
  # pulled from the Socrata API instead - see the `traffic:` block below.
  traffic_usable: true

time:
  timezone: America/New_York
  start_date: "2023-01-01"
  end_date: "2024-12-31"      # inclusive
  interval_minutes: 15
  horizons: [1, 2, 3, 4]      # in interval_minutes steps -> 15/30/45/60 min
  reported_horizons: [1, 2, 4]  # 45-min (h3) stays internal, per Phase 7

split:
  train: {start: "2023-01-01", end: "2024-08-31"}
  validate: {start: "2024-09-01", end: "2024-10-31"}
  test: {start: "2024-11-01", end: "2024-12-31"}

dev_sample:
  # 7 consecutive days inside TRAIN, used to verify every pipeline stage first.
  start: "2024-06-03"   # Monday
  end: "2024-06-09"     # Sunday

calendar:
  morning_rush: {start_hour: 7, end_hour: 10}   # [start, end)
  evening_rush: {start_hour: 16, end_hour: 19}  # [start, end)
  holiday_country: US
  holiday_subdiv: NY

cleaning:
  # Every rule below is applied as a *logged* filter - counts are written to the
  # data-quality report. No silent drops.
  min_duration_seconds: 60          # sub-minute rides are dock re-inserts / tests
  max_duration_seconds: 86400       # 24h; Citi Bike auto-closes long rentals
  drop_missing_coords: true
  drop_missing_station_id: false    # keep, flag as dockless/unknown-station
  drop_duplicate_ride_ids: true
  drop_end_before_start: true
  bbox:                             # NYC + Jersey City / Hoboken service area
    lat_min: 40.55
    lat_max: 41.00
    lng_min: -74.15
    lng_max: -73.70
  round_trip_flag: true             # same start/end station: flag, do not drop

station_registry:
  coord_jump_km_threshold: 0.5      # flag stations whose observed coords span > this
  min_rides_for_registry: 1

weather:
  provider: open_meteo
  archive_url: "https://archive-api.open-meteo.com/v1/archive"
  latitude: 40.7831                 # Central Park
  longitude: -73.9712
  hourly_variables:
    - temperature_2m
    - relative_humidity_2m
    - apparent_temperature
    - precipitation
    - rain
    - snowfall
    - snow_depth
    - wind_speed_10m
    - wind_gusts_10m
    - wind_direction_10m
    - cloud_cover
    # - visibility  # returned 100% null by the Open-Meteo/ERA5 archive - not available
    - weather_code
  # Feature thresholds (used in Phase 4)
  rain_mm_threshold: 0.1
  snow_cm_threshold: 0.1
  freezing_temp_c: 0.0
  high_wind_kmh: 30.0
  ffill_max_hours: 3

features:
  # Phase 3 keeps ONLY basic lags. Rolling / seasonal-slot / trend features are
  # deliberately deferred to Phase 4 so the gate measures a clean baseline.
  # Units are interval_minutes steps: 4 = 1h, 96 = 1 day, 672 = 1 week.
  basic_lags: [1, 2, 4, 8, 12, 24, 96, 192, 672]
  lag_targets: [pickups, dropoffs]
  # Rows before this many steps of history have null lags and cannot be trained on.
  # Equals max(basic_lags), i.e. one week of warm-up.
  drop_warmup_rows: true

advanced_features:
  # Phase 4 families, added cumulatively by the A-H ablation.
  # Windows are in interval_minutes steps: 4 = 1h, 12 = 3h, 24 = 6h, 96 = 1d, 672 = 1w.
  rolling_windows: [4, 12, 24, 96, 672]
  rolling_stats: [mean, std, sum]
  ewm_spans: [4, 12, 96]          # 1h / 3h / 24h
  trend_steps: [1, 2, 4]          # 15m / 30m / 1h change
  netflow_windows: [4, 24]        # 1h / 6h rolling net flow
  seasonal_slot_lags: {yesterday: 96, last_week: 672}
  # Expanding seasonal expectation: mean demand for this region at this weekday and
  # time-of-day slot, over PAST days only. min_periods guards a noisy first estimate.
  expanding_min_periods: 3
  neighbor_ring: 1
  neighbor_stats: [sum, mean, max]
  event_radius_km: 0.75           # an event counts for a region within this distance
  event_recent_minutes: 60        # started within the last hour
  event_ending_minutes: 60        # scheduled to end within the next hour
  traffic_max_link_distance_km: 1.0
  # DECIDED BY THE PHASE 4 ABLATION, not by assumption. A+B+C only:
  #   B calendar_seasonal  +4.85%  the one family that clearly pays
  #   C rolling_trend      +0.07%  marginal, kept (cheap, no external dependency)
  #   D weather            -0.52%  no measurable benefit
  #   E events             -0.01%  no effect (and 25% of events never geocoded)
  #   F traffic            +0.01%  no effect (covers 5.1% of regions)
  #   G spatial_neighbor   -0.06%  no benefit
  #   H station_network    +0.02%  no effect
  # Families D-H stay implemented and tested so the result is reproducible and the
  # decision can be revisited at another resolution - they are simply not selected.
  final_families: [A, B, C]

seasonal_naive:
  # Named seasonal_naive, NOT baseline: configs/lightgbm.yaml already defines a
  # `baseline:` block for the untuned model params, and the two would deep-merge
  # into one dict - feeding seasonal_naive_lags to LightGBM as a hyperparameter.
  # Prediction = demand at the same slot one day / one week ago. Both are computed;
  # the better one on VALIDATION is the baseline LightGBM must beat.
  seasonal_naive_lags: {same_day: 96, same_week: 672}

train:
  # 104M panel rows x ~36 features does not fit in 16 GB as a dense matrix. The
  # baseline trains on a uniform random subsample of TRAIN rows; VALIDATION and
  # TEST are always evaluated in full so the reported metrics are honest.
  # Phase 6 revisits this when tuning.
  train_sample_frac: 0.25
  sample_seed: 42
  exclude_dst_unreliable: true   # Phase 1/2 flagged these bins as not real demand

events:
  # Rows whose end precedes their start are data errors and are dropped (counted).
  drop_end_before_start: true
  # Permits can run for months or years (max observed: ~2.5 years). Those are
  # background conditions, not demand spikes, so they are FLAGGED rather than
  # dropped and Phase 4 decides how to treat them.
  long_running_minutes: 10080   # 7 days

traffic:
  # NYC DOT "Real-Time Traffic Speed Data" (Socrata dataset i4gi-tjb9).
  # ~23.8M observations over 2023-2024 across ~122 road links, one reading per link
  # roughly every 5 minutes.
  dataset_id: i4gi-tjb9
  domain: data.cityofnewyork.us
  # Optional Socrata app token. Anonymous requests work but are throttled harder.
  # Set the environment variable below rather than putting a token in the repo.
  app_token_env: SOCRATA_APP_TOKEN
  # Only these columns vary per observation. link_points / encoded_poly_line are
  # static per link and are pulled once into the link registry instead - carrying
  # them per row is what made the manual UI export unusably large.
  observation_columns: [id, link_id, speed, travel_time, status, data_as_of]
  registry_columns: [link_id, borough, link_name, owner, link_points, encoded_poly_line]
  # Paginate by time window, not by $offset: deep offsets get slower and slower,
  # while data_as_of is indexed.
  chunk_days: 1
  page_limit: 200000
  max_retries: 5
  retry_backoff_seconds: 5
  request_timeout_seconds: 180
  # `status` is the feed's own validity marker: "0" is a real reading, anything
  # else (in practice "-101", ~20% of rows) means the sensor reported nothing and
  # the row carries speed = 0. Keeping those would drag every average toward zero.
  valid_status: "0"
  # Speeds are mph. 0 is not a plausible observed speed on these links; the feed
  # uses it as a filler for invalid rows.
  min_speed_mph: 0.1
  max_speed_mph: 100.0

operations:
  # Capacity is ESTIMATED, not measured - no historical dock counts exist for
  # 2023-2024. See docs/DATA_SOURCES.md and src/inventory/estimate.py.
  capacity_quantile: 0.95        # q95 of the daily cumulative net-flow range
  min_capacity: 8
  volume_deciles: 10             # impute thin stations by trip-volume decile
  unreliable_fit_error: 2.0      # station-days needing this much intervention are flagged
  # Shortage/surplus thresholds. Swept rather than hardcoded, per the phase spec.
  safety_inventory_pcts: [0.0, 0.05, 0.10]
  target_inventory_pct: 0.50
  max_moves_per_round: 150
  max_move_distance_km: 3.0

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-7s | %(name)s | %(message)s"
